name: YoruHime Reborn Android Build

on:
  push:
    branches: [yoruhime/reborn, yoruhime/installable-ayaka-fix, yoruhime/filament-native-avatar]
  workflow_dispatch:

concurrency:
  group: reborn-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node for GLB conversion
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the VRM-to-GLB converter
        run: node scripts/test-prepare-ayaka-glb.mjs
      - name: Verify the original Ayaka model (never substitute a sample)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_MODEL="models/ayaka/Ayaka_Tojou 2.vrm"
          if [ ! -s "$SOURCE_MODEL" ]; then
            echo "::error::Uploaded Ayaka model is missing at $SOURCE_MODEL."
            exit 1
          fi
          echo "66b0944b3be41da8efe78909340bb64b31afa7262776b07679ce0b2fd1d2a601  $SOURCE_MODEL" | sha256sum --check
      - name: Prepare Filament-compatible Ayaka GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reborn/src/main/assets
          node scripts/prepare-ayaka-glb.mjs "models/ayaka/Ayaka_Tojou 2.vrm" reborn/src/main/assets/ayaka.glb
          test -s reborn/src/main/assets/ayaka.glb
          test -s reborn/src/main/assets/ayaka-vrm-metadata.json
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and assemble clean app
        id: build_apk
        run: gradle :reborn:testDebugUnitTest :reborn:assembleDebug
      - name: Run Android Lint
        timeout-minutes: 8
        run: gradle :reborn:lintDebug
      - name: Verify APK alignment and Android signature schemes
        if: always() && steps.build_apk.outcome == 'success'
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="reborn/build/outputs/apk/debug/reborn-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android 12 emulator
        if: steps.verify_apk.outcome == 'success'
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r reborn/build/outputs/apk/debug/reborn-debug.apk
            adb shell am force-stop com.yoruhime.reborn
            adb shell am start -n com.yoruhime.reborn/.MainActivity
            sleep 45
            APP_PID="$(adb shell pidof -s com.yoruhime.reborn | tr -d '\\r')"
            if [ -z "$APP_PID" ]; then
              echo "::error::YoruHime process exited after launch."
              adb logcat -d -t 1000 | grep -E "FATAL EXCEPTION|Fatal signal|AndroidRuntime|AyakaFilament" || true
              exit 1
            fi
            echo "YoruHime stayed alive after launch (PID $APP_PID)."
            LOGS="$(adb logcat -d -t 2000)"
            echo "$LOGS" | grep -E "FATAL EXCEPTION|Fatal signal|AndroidRuntime|AyakaFilament" || true
            if ! echo "$LOGS" | grep -q "Ayaka mesh rendered by Filament"; then
              echo "::error::Ayaka did not report a rendered mesh on the Android 12 emulator."
              exit 1
            fi
            echo "Ayaka's mesh reached Filament's rendered-frame callback."
      - name: Upload Reborn APK
        if: always() && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yoruhime-reborn-debug-apk
          path: reborn/build/outputs/apk/debug/reborn-debug.apk
          if-no-files-found: error
          retention-days: 30
