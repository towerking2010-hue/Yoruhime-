name: YoruHime Reborn Android Build

on:
  push:
    branches: [yoruhime/reborn, yoruhime/installable-ayaka-fix]
  workflow_dispatch:

concurrency:
  group: reborn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node for the offline avatar bundle
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the bundled Ayaka model (never substitute a sample)
        working-directory: avatar-web
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s public/ayaka.vrm ]; then
            echo "::error::Ayaka model is missing. Add the creator-authorized file at avatar-web/public/ayaka.vrm before building. The workflow will not silently download a placeholder avatar."
            exit 1
          fi
          echo "66b0944b3be41da8efe78909340bb64b31afa7262776b07679ce0b2fd1d2a601  public/ayaka.vrm" | sha256sum --check
          npm install --no-audit --no-fund
          npm run build
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and assemble clean app
        run: gradle :reborn:testDebugUnitTest :reborn:assembleDebug
      - name: Verify APK alignment and Android signature schemes
        shell: bash
        run: |
          set -euo pipefail
          APK="reborn/build/outputs/apk/debug/reborn-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload Reborn APK
        uses: actions/upload-artifact@v4
        with:
          name: yoruhime-reborn-debug-apk
          path: reborn/build/outputs/apk/debug/reborn-debug.apk
          if-no-files-found: error
          retention-days: 30
